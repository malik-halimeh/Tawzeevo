[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tawzeevo-api"
version = "0.1.0"
description = "Tawzeevo FastAPI service"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=44,<47",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "phonenumbers>=8.13,<10",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "PyJWT>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tawzeevo_api*"]

[tool.setuptools.package-data]
tawzeevo_api = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires an accessible disposable PostgreSQL test database"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

# Historical migrations are immutable (AGENTS.md / PHASE_03.md section M).
# These exact contents are guarded by test_immutable_migration_files.py.
# Retain every other lint rule and full checking for all other/new migrations.
[tool.ruff.lint.per-file-ignores]
"alembic/versions/20260827_0009_invoice_item_line_order.py" = ["I001"]

[tool.ruff.format]
exclude = [
  "alembic/versions/20260827_0009_invoice_item_line_order.py",
  "alembic/versions/20260827_0010_financial_confirmation_debt.py",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
packages = ["tawzeevo_api"]
