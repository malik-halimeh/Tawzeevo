services:
  - type: web
    name: tawzeevo-api-malik-halimeh
    runtime: python
    plan: free
    region: frankfurt
    rootDir: apps/api
    buildCommand: pip install .
    # Migrations run before the API starts so every deploy carries its schema (free plan has no
    # separate pre-deploy step). Alembic is idempotent: an already-migrated database is a no-op.
    # --no-access-log: the structured tawzeevo.access line (route template + request id) is the
    # access log; uvicorn's raw request line would repeat it with the query string (PHASE_09.md G).
    startCommand: alembic upgrade head && uvicorn tawzeevo_api.main:app --host 0.0.0.0 --port $PORT --no-access-log
    # /health answers 503 until the schema is at the head the code expects, so a failed
    # migration keeps the previous release serving (PHASE_09.md H).
    healthCheckPath: /health
    # Live deploys are triggered by .github/workflows/deploy.yml after green CI (PHASE_09.md H);
    # a push must not deploy on its own. Confirm the dashboard setting matches after a sync.
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      # One hosting proxy in front of the API: the client IP for the login/recovery throttles and
      # public rate limits is the last X-Forwarded-For hop (apps/api/tawzeevo_api/client_ip.py).
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Turn on once the API connects with a NOSUPERUSER NOBYPASSRLS role
      # (docs/runbooks/database-role.md); the API refuses to start otherwise.
      - key: DB_ROLE_REQUIRE_RLS_SUBJECT
        value: "false"
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://tawzeevo-malik-halimeh.onrender.com","https://tawzeevo-shop-malik-halimeh.onrender.com"]'
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      # The operations client and the API are two onrender.com sites (D-088, pending owner
      # confirmation): the refresh cookie must be SameSite=None and the Origin guard applies.
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      # Production refuses to start without these (config.py validate_production_security).
      # Transactional e-mail (D-077): provider name and key live in the dashboard.
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: PASSWORD_RESET_URL
        value: https://tawzeevo-malik-halimeh.onrender.com/reset-password
      # Customer verification delivery provider (D-073): the development adapter is refused in
      # production; the owner sets the chosen provider here (launch-gate item 2).
      - key: CUSTOMER_OTP_PROVIDER
        sync: false
      # Encrypted Google Drive backup (Phase 4). Set the three secrets in the dashboard when the
      # OAuth client exists; until then the Backup tab reports "not configured".
      - key: BACKUP_MASTER_KEY
        sync: false
      - key: BACKUP_KEK_ID
        value: kek-prod-1
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://tawzeevo-malik-halimeh.onrender.com/backup/google/callback
      - key: BACKUP_SCHEDULER_ENABLED
        value: "true"

  - type: web
    name: tawzeevo-malik-halimeh
    runtime: static
    buildCommand: npm ci && npm run build:operations
    staticPublishPath: ./apps/operations-web/dist
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: VITE_API_BASE_URL
        value: https://tawzeevo-api-malik-halimeh.onrender.com
      - key: VITE_STOREFRONT_BASE_URL
        value: https://tawzeevo-shop-malik-halimeh.onrender.com
      - key: VITE_DEMO_PREVIEW
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Public per-business storefront (Phase 5): server-rendered Next.js, one address per business.
  - type: web
    name: tawzeevo-shop-malik-halimeh
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build:storefront
    startCommand: npm run start --workspace @tawzeevo/storefront-web -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: API_BASE_URL
        value: https://tawzeevo-api-malik-halimeh.onrender.com
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://tawzeevo-api-malik-halimeh.onrender.com
