services:
  - type: web
    name: tawzeevo-api-malik-halimeh
    runtime: python
    plan: free
    region: frankfurt
    rootDir: apps/api
    buildCommand: pip install .
    startCommand: uvicorn tawzeevo_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://tawzeevo-malik-halimeh.onrender.com"]'
      - key: REFRESH_COOKIE_SECURE
        value: "true"

  - type: web
    name: tawzeevo-malik-halimeh
    runtime: static
    buildCommand: npm ci && npm run build:operations
    staticPublishPath: ./apps/operations-web/dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: VITE_API_BASE_URL
        value: https://tawzeevo-api-malik-halimeh.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
