name: Deploy live after green CI

# PHASE_09.md H (P9-M4): the live services deploy only after the CI workflow succeeded on main.
# Staging deploys on every push (Render auto-deploy) and is the rehearsal; live is gated here.
# The Render API key lives in the repository secret RENDER_API_KEY; service ids are not secret.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      API_SERVICE: srv-da3g89ht0dsc73fjonag
      WEB_SERVICE: srv-da3g89ht0dsc73fjona0
      SHOP_SERVICE: srv-damjm64ri2ms73dkoehg
    steps:
      - uses: actions/checkout@v4
      - name: Record the migration head this commit ships
        id: head
        run: echo "expected=$(python3 apps/api/scripts/migration_head.py)" >> "$GITHUB_OUTPUT"
      - name: Trigger deploys
        run: |
          set -e
          for svc in "$API_SERVICE" "$WEB_SERVICE" "$SHOP_SERVICE"; do
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST "https://api.render.com/v1/services/$svc/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')
            echo "$svc -> HTTP $code"
            test "$code" = "201" || { cat /tmp/out.json; exit 1; }
          done
      - name: Wait for the API to come back with the expected migration head
        env:
          EXPECTED_HEAD: ${{ steps.head.outputs.expected }}
        run: |
          test -n "$EXPECTED_HEAD" || { echo "no migration head computed"; exit 1; }
          for i in $(seq 1 40); do
            body=$(curl -s --max-time 30 https://tawzeevo-api-malik-halimeh.onrender.com/health/database || true)
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "$body"
              # The deployed schema must be exactly the head this commit ships (PHASE_09.md H).
              echo "$body" | grep -q "\"migration_head\":\"$EXPECTED_HEAD\"" && exit 0
              echo "API is healthy but not at migration head $EXPECTED_HEAD yet"
            fi
            sleep 15
          done
          echo "API did not report healthy at migration head $EXPECTED_HEAD within 10 minutes"; exit 1
