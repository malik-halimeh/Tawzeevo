name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, ruff, mypy, alembic, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tawzeevo_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/tawzeevo_ci
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/tawzeevo_ci
      JWT_SECRET: ci-only-disposable-secret-at-least-32-bytes-long
      BACKUP_DRIVE_PROVIDER: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pip-audit
      - name: Lint and types
        working-directory: apps/api
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy tawzeevo_api
      - name: Migrate from zero and check drift
        working-directory: apps/api
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Tests
        working-directory: apps/api
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Dependency audit
        working-directory: apps/api
        run: python -m pip_audit --progress-spinner off

  web:
    name: Operations client and storefront (lint, types, tests, build, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Real-browser flows (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tawzeevo_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/tawzeevo_e2e
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/tawzeevo_e2e
      JWT_SECRET: ci-only-disposable-secret-at-least-32-bytes-long
      BACKUP_DRIVE_PROVIDER: memory
      CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:5173","http://127.0.0.1:3000"]'
      E2E_API_URL: http://127.0.0.1:8011
      E2E_WEB_URL: http://127.0.0.1:5173
      E2E_SHOP_URL: http://127.0.0.1:3000
      E2E_ADMIN_EMAIL: admin-e2e@example.com
      E2E_ADMIN_PASSWORD: E2eAdminPassword123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install API
        working-directory: apps/api
        run: python -m pip install -e .
      - name: Migrate and create the platform admin
        working-directory: apps/api
        run: |
          python -m alembic upgrade head
          python - <<'PY'
          import getpass, sys
          getpass.getpass = lambda *a, **k: "E2eAdminPassword123!"
          from tawzeevo_api.cli import create_admin
          sys.argv = ["create_admin", "--first-name", "E2E", "--last-name", "Admin", "--email", "admin-e2e@example.com", "--phone", "+96170999001", "--city", "Beirut", "--age", "40"]
          create_admin.main()
          PY
      - name: Build the storefront against the local API
        env:
          API_BASE_URL: http://127.0.0.1:8011
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8011
        run: npm run build:storefront
      - name: Start API, client and storefront
        run: |
          (cd apps/api && python -m uvicorn tawzeevo_api.main:app --host 127.0.0.1 --port 8011 > /tmp/api.log 2>&1 &)
          (cd apps/operations-web && VITE_API_BASE_URL=http://127.0.0.1:8011 npx vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/web.log 2>&1 &)
          (cd apps/storefront-web && API_BASE_URL=http://127.0.0.1:8011 NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8011 npx next start -H 127.0.0.1 -p 3000 > /tmp/shop.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8011/health >/dev/null && curl -sf http://127.0.0.1:5173 >/dev/null && curl -sf http://127.0.0.1:3000 >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8011/health/database
      - name: Install Chromium
        working-directory: apps/operations-web
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: apps/operations-web
        run: npx playwright test --reporter=line
      - name: Server logs on failure
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log /tmp/shop.log
